plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.darrenai.omniscient'
    compileSdk 34

    defaultConfig {
        applicationId "com.darrenai.omniscient"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0.0"
    }

    signingConfigs {
        release {
            storeFile file(findProperty('RELEASE_STORE_FILE') ?: 'omniscient-release.keystore')
            storePassword findProperty('RELEASE_STORE_PASSWORD')
            keyAlias findProperty('RELEASE_KEY_ALIAS')
            keyPassword findProperty('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
